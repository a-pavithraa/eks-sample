apiVersion: v1
kind: Service
metadata:
  name: catalog-db
  labels:
    {{- include "spring-boot-microservices.labels" . | nindent 4 }}
spec:
  selector:
    app: catalog-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: orders-db
  labels:
    {{- include "spring-boot-microservices.labels" . | nindent 4 }}
spec:
  selector:
    app: orders-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: bookstore-rabbitmq
  labels:
    {{- include "spring-boot-microservices.labels" . | nindent 4 }}
spec:
  selector:
    app: bookstore-rabbitmq
  ports:
    - protocol: TCP
      port: 5672
      targetPort: 5672
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: notifications-db
  labels:
    {{- include "spring-boot-microservices.labels" . | nindent 4 }}
spec:
  selector:
    app: notifications-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: mailhog
  labels:
    {{- include "spring-boot-microservices.labels" . | nindent 4 }}
spec:
  selector:
    app: mailhog
  ports:
    - name: smtp
      protocol: TCP
      port: 1025
      targetPort: 1025
      nodePort: 32679
    - name: http
      protocol: TCP
      port: 8025
      targetPort: 8025
      nodePort: 32678
  type: NodePort 